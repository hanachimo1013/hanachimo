services:
  web-app:
    build: .
    container_name: web-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
      - .env.server
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - app-bridge

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    # Use default QUIC transport for better connection stability
    command: tunnel --no-autoupdate run --token eyJhIjoiMzA3YjE4ZmJmN2Y3OGFiMjFjNTM1YTRiMDMxZDhhZGQiLCJ0IjoiNGE5YjI1OGUtN2Y0MS00MmZhLWEwZWUtZWNjYmY4NjY3M2U3IiwicyI6Ik1XRXpNMlUxWkdFdFpqWmpaaTAwWW1VNExUZ3pOakV0WW1JMU0yWXhPV05qWmpGak9ETmlOekZsWkdRdE16VTNaQzAwWm1VNExUZzJZakV0WldReU9HVm1NbUV6TUdRdyJ9
    depends_on:
      - web-app
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-bridge

networks:
  app-bridge:
    driver: bridge

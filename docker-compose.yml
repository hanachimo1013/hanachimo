services:
  web-app:
    build: .
    container_name: web-app
    restart: always
    env_file:
      - .env
      - .env.server
    expose:
      - "4000"
    networks:
      - app-bridge

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiMzA3YjE4ZmJmN2Y3OGFiMjFjNTM1YTRiMDMxZDhhZGQiLCJ0IjoiNGE5YjI1OGUtN2Y0MS00MmZhLWEwZWUtZWNjYmY4NjY3M2U3IiwicyI6Ill6QTVNalppWkRZdE5ESXlOeTAwTlRSakxXRTNOVGN0TVRaak4ySXdPVEV6TlRWaCJ9
    depends_on:
      - web-app
    networks:
      - app-bridge

networks:
  app-bridge:
    driver: bridge